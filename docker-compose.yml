services:
  # PostgreSQL Database with pgvector extension
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: recipbot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recipbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d recipbot" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recipbot_network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: recipbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recipbot_network

  # MinIO - S3-compatible object storage for recipe photos.
  # API on :9000 (the browser loads photos from here), console on :9001.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: recipbot-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: recipbot
      MINIO_ROOT_PASSWORD: recipbot-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recipbot_network

  # One-shot: create the photos bucket and allow anonymous *downloads* (the
  # frontend loads photos straight into <img>; object keys are random UUIDs).
  # Uploads still require the credentials above, used only by the backend.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: recipbot-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 recipbot recipbot-secret &&
      mc mb --ignore-existing local/recipbot &&
      mc anonymous set download local/recipbot
      "
    networks:
      - recipbot_network

  # Laravel Backend
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: recipbot-app
    environment:
      APP_NAME: RecipBot
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      # Run migrations on boot so a fresh database has its schema (users,
      # recipes, ...) before the app serves the first request. Only this
      # service migrates; the workers below wait for it to become healthy.
      RUN_MIGRATIONS: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: recipbot
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      BROADCAST_DRIVER: redis
      # Recipe photos on MinIO (see the minio service). AWS_URL is the public
      # base the browser uses, so it points at the host port, not "minio".
      RECIPE_IMAGES_DISK: s3
      AWS_ACCESS_KEY_ID: recipbot
      AWS_SECRET_ACCESS_KEY: recipbot-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: recipbot
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: http://localhost:9000/recipbot
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - /app/vendor
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: php artisan serve --host=0.0.0.0 --port=8000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - recipbot_network

  # Laravel Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: recipbot-queue
    environment:
      APP_NAME: RecipBot
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: recipbot
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    volumes:
      - ./:/app
      - /app/vendor
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command: php artisan queue:listen redis --tries=3 --timeout=90
    networks:
      - recipbot_network

  # Laravel Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: recipbot-scheduler
    environment:
      APP_NAME: RecipBot
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: recipbot
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./:/app
      - /app/vendor
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    command: /bin/sh -c "while true; do php artisan schedule:run; sleep 60; done"
    networks:
      - recipbot_network

  # Vue 3 Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: recipbot-frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_APP_NAME: RecipBot
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app
    command: npm run dev -- --host
    networks:
      - recipbot_network

  # Database Admin (Debug Only)
  adminer:
    image: adminer:latest
    container_name: recipbot-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - recipbot_network
    profiles:
      - debug

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  recipbot_network:
    driver: bridge
