<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>RecipBot — Minhas receitas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F6B3B}a:hover{color:#234F2C}
</style>
</helmet>
<div style="min-height: 1240px; background: {{c.bg}}; color: {{c.fg}}; font-family: 'Instrument Sans', system-ui, sans-serif">
  <header style="border-bottom: 1px solid {{c.border}}; background: {{c.bg}}">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: {{c.fg}}">
        <svg width="36" height="36" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#2F6B3B"></rect><circle cx="17" cy="13.5" r="5.5" fill="#FBFAF7"></circle><circle cx="24" cy="10.5" r="6.5" fill="#FBFAF7"></circle><circle cx="31" cy="13.5" r="5.5" fill="#FBFAF7"></circle><rect x="15" y="13" width="18" height="6" rx="1.5" fill="#FBFAF7"></rect><rect x="8.5" y="27" width="3" height="7" rx="1.5" fill="#FBFAF7"></rect><rect x="36.5" y="27" width="3" height="7" rx="1.5" fill="#FBFAF7"></rect><rect x="11" y="21" width="26" height="19" rx="6" fill="#FBFAF7"></rect><rect x="14.5" y="24.5" width="19" height="11" rx="4" fill="#1C1B19"></rect><circle cx="20" cy="29.5" r="2.1" fill="#7DBB84"></circle><circle cx="28" cy="29.5" r="2.1" fill="#7DBB84"></circle></svg>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.02em">RecipBot</span>
      </a>
      <nav aria-label="Principal" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
        <a href="#" aria-current="page" style="height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 10px; background: {{c.secondary}}; color: {{c.onSecondary}}; font-weight: 600; font-size: 15px; text-decoration: none">Receitas</a>
        <a href="#" style="height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 10px; color: {{c.muted}}; font-weight: 600; font-size: 15px; text-decoration: none">Ajuda</a>
        <button type="button" aria-label="Alternar tema" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: {{c.muted}}; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></button>
        <a href="#" aria-label="Perfil" style="width: 40px; height: 40px; border-radius: 999px; background: {{c.surface2}}; color: {{c.fg}}; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; text-decoration: none">PM</a>
      </nav>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 48px 24px 64px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px">
      <div>
        <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{c.muted}}">24 receitas · 9 tags</p>
        <h1 style="margin: 6px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; line-height: 1.05; letter-spacing: -0.03em">Minhas receitas</h1>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" style="height: 44px; padding: 0 16px; border: 1px solid {{c.border2}}; border-radius: 10px; background: {{c.card}}; color: {{c.fg}}; font: 600 15px 'Instrument Sans', sans-serif; display: inline-flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Importar link</button>
        <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: {{c.primary}}; color: {{c.onPrimary}}; font: 600 15px 'Instrument Sans', sans-serif; display: inline-flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Nova receita</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; border: 1px solid {{c.border2}}; border-radius: 999px; background: {{c.surface2}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.65" y2="16.65"></line></svg>
        <label for="l-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Buscar receitas</label>
        <input id="l-search" placeholder="Buscar por título, ingrediente ou tag" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 400 17px 'Instrument Sans', sans-serif; color: {{c.fg}}; outline: none">
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
          <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font: 600 14px 'Instrument Sans', sans-serif">{{f.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px">
      <sc-for list="{{recipes}}" as="r" hint-placeholder-count="6">
        <a href="RecipeDetail.dc.html" style="display: flex; flex-direction: column; background: {{c.card}}; border: 1px solid {{c.border}}; border-radius: 16px; overflow: hidden; text-decoration: none; color: {{c.fg}}">
          <div style="height: 120px; background: {{r.tint}}; display: flex; align-items: flex-end; justify-content: space-between; padding: 14px 16px; box-sizing: border-box">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 60px; line-height: 0.8; color: {{r.ink}}">{{r.initial}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; color: {{r.ink}}">{{r.time}}</span>
          </div>
          <div style="padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 8px">
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; letter-spacing: -0.01em">{{r.title}}</span>
            <span style="font-size: 14px; color: {{c.muted}}">{{r.meta}}</span>
            <span style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px">
              <sc-for list="{{r.tags}}" as="tag" hint-placeholder-count="2">
                <span style="font-size: 12px; font-weight: 600; background: {{c.surface2}}; color: {{c.fg2}}; border-radius: 999px; padding: 3px 10px">{{tag}}</span>
              </sc-for>
            </span>
          </div>
        </a>
      </sc-for>
    </div>

    <nav aria-label="Paginação" style="display: flex; justify-content: center; gap: 6px">
      <a href="#" aria-current="page" style="width: 44px; height: 44px; border-radius: 10px; background: {{c.primary}}; color: {{c.onPrimary}}; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; text-decoration: none">1</a>
      <a href="#" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid {{c.border2}}; color: {{c.fg}}; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; text-decoration: none; box-sizing: border-box">2</a>
      <a href="#" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid {{c.border2}}; color: {{c.fg}}; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; text-decoration: none; box-sizing: border-box">3</a>
    </nav>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { picked: 'Todas' }; }
renderVals() {
const dark = this.props.dark ?? false;
const c = dark
? { bg: '#161714', fg: '#EDEBE4', fg2: '#D3CDBF', muted: '#A9A291', card: '#1F211D', surface2: '#2A2823', border: '#2A2823', border2: '#33312B', primary: '#7DBB84', onPrimary: '#161714', secondary: '#1A3B21', onSecondary: '#C3DEC2' }
: { bg: '#FBFAF7', fg: '#1C1B19', fg2: '#423E35', muted: '#5B5649', card: '#FFFFFF', surface2: '#F4F2EC', border: '#E7E3D9', border2: '#D3CDBF', primary: '#2F6B3B', onPrimary: '#FFFFFF', secondary: '#E3EFE2', onSecondary: '#234F2C' };
const tints = dark
? { verde: ['#1A3B21', '#C3DEC2'], paprica: ['#64250E', '#F6C6AF'], acafrao: ['#4A3307', '#F7DFA0'], farinha: ['#2A2823', '#E7E3D9'] }
: { verde: ['#E3EFE2', '#234F2C'], paprica: ['#FBE4D9', '#8A3414'], acafrao: ['#FBF0D2', '#6B4A0A'], farinha: ['#F4F2EC', '#423E35'] };
const data = [
['Bolo de fubá cremoso', '9 ingredientes · há 2 dias', 'manual', 'acafrao', ['sobremesa', 'forno']],
['Risoto de cogumelos', '11 ingredientes · há 1 semana', 'manual', 'verde', ['vegetariano']],
['Moqueca baiana', '14 ingredientes · há 3 dias', 'link', 'paprica', ['peixe', 'almoço']],
['Pão de queijo', '6 ingredientes · há 3 semanas', 'manual', 'farinha', ['lanche']],
['Salada de grão-de-bico', '8 ingredientes · há 1 mês', 'link', 'verde', ['vegano', 'rápido']],
['Feijoada da vó', '16 ingredientes · há 2 meses', 'manual', 'paprica', ['almoço']]
];
const recipes = data.map(([title, meta, time, tone, tags]) => ({ title, meta, time, tags, initial: title[0], tint: tints[tone][0], ink: tints[tone][1] }));
const filters = ['Todas', 'sobremesa', 'vegetariano', 'almoço', 'lanche', 'rápido'].map((label) => {
const on = this.state.picked === label;
return { label, pressed: on ? 'true' : 'false', bg: on ? c.primary : 'transparent', fg: on ? c.onPrimary : c.fg2, border: on ? c.primary : c.border2, pick: () => this.setState({ picked: label }) };
});
return { c, recipes, filters };
}
}
</script>
</body>
</html>
