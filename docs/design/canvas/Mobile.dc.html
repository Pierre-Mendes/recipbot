<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>RecipBot — Lista no celular, modo escuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7DBB84}a:hover{color:#9CC79E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #161714; color: #EDEBE4; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <header style="padding: 20px 16px 12px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em">RecipBot</span>
    <div style="display: flex; gap: 4px">
      <button type="button" aria-label="Alternar tema" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #A9A291; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg></button>
      <a href="#" aria-label="Perfil" style="width: 44px; height: 44px; border-radius: 999px; background: #2A2823; color: #EDEBE4; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; text-decoration: none">PM</a>
    </div>
  </header>
  <div style="padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: -0.03em">Minhas receitas</h1>
    <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border: 1px solid #33312B; border-radius: 999px; background: #2A2823">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9A291" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.65" y2="16.65"></line></svg>
      <label for="m-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Buscar receitas</label>
      <input id="m-search" placeholder="Buscar receitas" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 400 16px 'Instrument Sans', sans-serif; color: #EDEBE4; outline: none">
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto">
      <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: #7DBB84; color: #161714; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; flex-shrink: 0">Todas</span>
      <span style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #33312B; color: #D3CDBF; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; flex-shrink: 0">sobremesa</span>
      <span style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #33312B; color: #D3CDBF; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; flex-shrink: 0">vegetariano</span>
      <span style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #33312B; color: #D3CDBF; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; flex-shrink: 0">almoço</span>
    </div>
  </div>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="r" hint-placeholder-count="5">
      <a href="#" style="display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; background: #1F211D; border: 1px solid #2A2823; border-radius: 14px; padding: 8px; text-decoration: none; color: #EDEBE4">
        <span style="height: 72px; border-radius: 10px; background: {{r.tint}}; color: {{r.ink}}; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px">{{r.initial}}</span>
        <span style="min-width: 0">
          <span style="display: block; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
          <span style="display: block; font-size: 13px; color: #A9A291; margin-top: 3px">{{r.meta}}</span>
        </span>
      </a>
    </sc-for>
  </div>
  <a href="#" aria-label="Nova receita" style="position: absolute; right: 16px; bottom: 24px; width: 60px; height: 60px; border-radius: 18px; background: #7DBB84; color: #161714; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const t = { verde: ['#1A3B21', '#C3DEC2'], paprica: ['#64250E', '#F6C6AF'], acafrao: ['#4A3307', '#F7DFA0'], farinha: ['#2A2823', '#E7E3D9'] };
const items = [
['Bolo de fubá cremoso', '9 ingredientes · sobremesa', 'acafrao'],
['Risoto de cogumelos', '11 ingredientes · vegetariano', 'verde'],
['Moqueca baiana', '14 ingredientes · importada', 'paprica'],
['Pão de queijo', '6 ingredientes · lanche', 'farinha'],
['Salada de grão-de-bico', '8 ingredientes · vegano', 'verde']
].map(([title, meta, tone]) => ({ title, meta, initial: title[0], tint: t[tone][0], ink: t[tone][1] }));
return { items };
}
}
</script>
</body>
</html>
