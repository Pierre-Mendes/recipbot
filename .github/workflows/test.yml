name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recipbot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_pgsql, mbstring, xml, json, bcmath
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress

      - name: Setup .env
        run: |
          cp .env.example .env.test
          sed -i 's/DB_HOST=.*/DB_HOST=localhost/' .env.test
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env.test
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=recipbot_test/' .env.test
          sed -i 's/APP_ENV=.*/APP_ENV=testing/' .env.test

      - name: Generate APP_KEY
        run: php artisan key:generate --env=test

      - name: Run migrations
        run: php artisan migrate --env=test --no-interaction
        env:
          DB_HOST: localhost
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: recipbot_test

      - name: Run tests
        run: php artisan test --env=test --coverage --coverage-clover=coverage.xml
        env:
          DB_HOST: localhost
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: recipbot_test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: true

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Format check
        run: cd frontend && npm run format:check

      - name: Type check
        run: cd frontend && npm run type-check

      - name: Run tests
        run: cd frontend && npm run test -- --coverage
        env:
          VITE_API_URL: http://localhost:8000/api

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: true

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_pgsql, mbstring, xml, json

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress

      - name: Run PHPStan
        run: composer run phpstan

      - name: Check PSR-12 style
        run: composer run pint -- --test

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_pgsql, mbstring, xml, json

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress

      - name: Check for vulnerabilities
        run: composer audit

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Check frontend dependencies
        run: cd frontend && npm audit --audit-level=moderate || true

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
