# App Laravel. O ENTRYPOINT da imagem roda `migrate --force` quando
# RUN_MIGRATIONS=true (só ESTE deployment migra) e depois o CMD (php artisan serve).
# initContainer espera o Postgres pra evitar crashloop na primeira subida.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipbot-app
  namespace: recipbot-stg
spec:
  replicas: 1
  selector:
    matchLabels: { app: recipbot-app }
  strategy:
    type: Recreate   # migração no boot: evita 2 pods migrando ao mesmo tempo
  template:
    metadata:
      labels: { app: recipbot-app }
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
          command: ["sh", "-c", "until nc -z recipbot-postgres 5432; do echo aguardando postgres; sleep 2; done"]
      containers:
        - name: app
          image: ghcr.io/pierre-mendes/recipbot-backend:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - { name: RUN_MIGRATIONS, value: "true" }
          envFrom:
            - configMapRef: { name: recipbot-config }
            - secretRef: { name: recipbot-secrets }
          ports:
            - { containerPort: 8000, name: http }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: recipbot-app
  namespace: recipbot-stg
spec:
  selector: { app: recipbot-app }
  ports:
    - { port: 8000, targetPort: 8000, name: http }
