# Workers: queue e scheduler. Mesma imagem do app, mas SEM RUN_MIGRATIONS
# (só o app migra) - aqui só sobrescrevemos o comando (args = CMD; o ENTRYPOINT
# entrypoint.sh continua rodando, e como RUN_MIGRATIONS não está setado, ele
# pula a migração e executa estes args).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipbot-queue
  namespace: recipbot-stg
spec:
  replicas: 1
  selector:
    matchLabels: { app: recipbot-queue }
  template:
    metadata:
      labels: { app: recipbot-queue }
    spec:
      initContainers:
        - name: wait-app
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
          command: ["sh", "-c", "until nc -z recipbot-app 8000; do echo aguardando app; sleep 2; done"]
      containers:
        - name: queue
          image: ghcr.io/pierre-mendes/recipbot-backend:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          args: ["php", "artisan", "queue:listen", "redis", "--tries=3", "--timeout=90"]
          envFrom:
            - configMapRef: { name: recipbot-config }
            - secretRef: { name: recipbot-secrets }
          resources:
            requests: { cpu: "50m", memory: "192Mi" }
            limits: { memory: "512Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipbot-scheduler
  namespace: recipbot-stg
spec:
  replicas: 1
  selector:
    matchLabels: { app: recipbot-scheduler }
  template:
    metadata:
      labels: { app: recipbot-scheduler }
    spec:
      initContainers:
        - name: wait-app
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
          command: ["sh", "-c", "until nc -z recipbot-app 8000; do echo aguardando app; sleep 2; done"]
      containers:
        - name: scheduler
          image: ghcr.io/pierre-mendes/recipbot-backend:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          args: ["/bin/sh", "-c", "while true; do php artisan schedule:run; sleep 60; done"]
          envFrom:
            - configMapRef: { name: recipbot-config }
            - secretRef: { name: recipbot-secrets }
          resources:
            requests: { cpu: "50m", memory: "192Mi" }
            limits: { memory: "512Mi" }
