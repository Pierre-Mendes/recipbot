# Redis (cache + fila). Em staging os dados são efêmeros (emptyDir) - se quiser
# persistir a fila, troque por um PVC como o do Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipbot-redis
  namespace: recipbot-stg
spec:
  replicas: 1
  selector:
    matchLabels: { app: recipbot-redis }
  template:
    metadata:
      labels: { app: recipbot-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 6379, name: redis }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "256Mi" }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: recipbot-redis
  namespace: recipbot-stg
spec:
  selector: { app: recipbot-redis }
  ports:
    - { port: 6379, targetPort: 6379 }
