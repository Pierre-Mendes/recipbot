# Postgres (pgvector) — StatefulSet com PVC (local-path). Dados persistem em disco
# do node. Service HEADLESS (clusterIP: None) com nome estável recipbot-postgres.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: recipbot-postgres
  namespace: recipbot-stg
spec:
  serviceName: recipbot-postgres
  replicas: 1
  selector:
    matchLabels: { app: recipbot-postgres }
  template:
    metadata:
      labels: { app: recipbot-postgres }
    spec:
      containers:
        - name: postgres
          image: ghcr.io/pierre-mendes/recipbot-postgres:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - { containerPort: 5432, name: postgres }
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_DB, value: recipbot }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: recipbot-secrets, key: DB_PASSWORD }
            # subdir evita "data dir not empty" em alguns volumes
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "recipbot"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "recipbot"] }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "1Gi" }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: recipbot-postgres
  namespace: recipbot-stg
spec:
  clusterIP: None
  selector: { app: recipbot-postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
