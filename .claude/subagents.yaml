# RecipBot MVP - Agents Configuration
# Sistema de 3 Agents Especializados com Subagents

orchestrator:
  name: "Master Orchestrator"
  description: "Coordena agents especializados e delega tarefas"
  model: "claude-opus"
  role: "Task Distribution & Coordination"

  task_distribution_rules:
    - pattern: "^feature:"
      delegate_to: "CodingAgent"
      with_pre_processing: "AnalysisAgent"

    - pattern: "^review:"
      delegate_to: "ReviewAgent"

    - pattern: "^analysis:|plan:|estimate:"
      delegate_to: "AnalysisAgent"

    - pattern: "^fix:|refactor:"
      delegate_to: "CodingAgent"
      with_post_processing: "ReviewAgent"

---
# AGENT 1: CODING AGENT
agents:
  - name: "CodingAgent"
    id: "coding"
    role: "Code Implementation & Development"
    model: "claude-opus"
    temperature: 0.2
    max_context_kb: 200
    timeout_minutes: 60

    description: |
      Responsável por implementação de código, correção de bugs,
      refatoração e manutenção. Trabalha com Laravel backend,
      Vue 3 frontend, migrations e testes.

    capabilities:
      - php_laravel_11
      - vue3_typescript
      - database_migrations
      - unit_testing
      - git_management

    context_files:
      - path: "agents/coding/context-backend.md"
        size_kb: 25
        refresh_every_hours: 24
        description: "Padrões Laravel, Services, Models, Controllers"

      - path: "agents/coding/context-frontend.md"
        size_kb: 20
        refresh_every_hours: 24
        description: "Padrões Vue 3, Pinia, Componentes, TypeScript"

      - path: "agents/coding/context-project.md"
        size_kb: 15
        refresh_every_hours: 12
        description: "Estrutura do projeto, convenções"

      - path: "shared/conventions.md"
        size_kb: 10
        refresh_every_hours: 24
        description: "Convenções globais (naming, formatting, etc)"

    subagents:
      - name: "BackendBuilder"
        task: "Implementar código Laravel (Services, Controllers, Models)"
        spawned_for:
          - "feature:backend"
          - "fix:backend"
          - "refactor:backend"
          - "endpoint:create"
        context_focus: "Laravel patterns, business logic"
        timeout_minutes: 45

      - name: "FrontendBuilder"
        task: "Implementar código Vue 3 (Componentes, Stores, Composables)"
        spawned_for:
          - "feature:frontend"
          - "fix:frontend"
          - "refactor:frontend"
          - "component:create"
        context_focus: "Vue 3, TypeScript, Pinia patterns"
        timeout_minutes: 40

      - name: "DatabaseBuilder"
        task: "Criar/atualizar migrations, seeds, indices"
        spawned_for:
          - "migration:create"
          - "migration:update"
          - "seed:create"
          - "index:add"
        context_focus: "PostgreSQL, Laravel migrations, pgvector"
        timeout_minutes: 30

      - name: "GitManager"
        task: "Gerenciar commits, branches, push, rebase"
        spawned_for:
          - "git:commit"
          - "git:push"
          - "git:branch:create"
          - "git:rebase"
        context_focus: "Git workflow, commit strategy"
        timeout_minutes: 20

    output_format: "code_with_tests"
    min_coverage: 0.80
    validation_rules:
      - phpstan_level_8
      - eslint_strict
      - prettier_format
      - pest_tests_passing

---
# AGENT 2: REVIEW AGENT
  - name: "ReviewAgent"
    id: "review"
    role: "Quality & Security Review"
    model: "claude-sonnet"
    temperature: 0.1
    max_context_kb: 150
    timeout_minutes: 30

    description: |
      Responsável por análise de qualidade, segurança, performance
      e cobertura de testes. Valida code style, vulnerabilidades,
      otimizações e critérios de aceitação.

    capabilities:
      - code_quality_analysis
      - security_auditing
      - performance_review
      - test_coverage_analysis
      - owasp_validation

    context_files:
      - path: "agents/review/context-quality.md"
        size_kb: 20
        refresh_every_hours: 24
        description: "PHPStan rules, ESLint rules, Clean Code"

      - path: "agents/review/context-security.md"
        size_kb: 18
        refresh_every_hours: 24
        description: "OWASP top 10, SSRF, SQL Injection, XSS, Auth"

      - path: "agents/review/context-performance.md"
        size_kb: 15
        refresh_every_hours: 24
        description: "Query optimization, caching, frontend performance"

      - path: "shared/definitions.md"
        size_kb: 12
        refresh_every_hours: 24
        description: "Definições de termos, métricas, padrões"

    subagents:
      - name: "SecurityAuditor"
        task: "Auditar segurança (OWASP, vulnerabilidades, auth)"
        spawned_for:
          - "review:security"
          - "audit:dependencies"
          - "check:ssrf"
          - "check:injection"
        context_focus: "OWASP, Laravel security, XSS prevention"
        timeout_minutes: 25

      - name: "PerformanceReviewer"
        task: "Revisar performance (queries, caching, frontend)"
        spawned_for:
          - "review:performance"
          - "analyze:queries"
          - "check:caching"
          - "optimize:api"
        context_focus: "Database optimization, Redis, API design"
        timeout_minutes: 20

      - name: "CodeStyleChecker"
        task: "Validar style (PHPStan, ESLint, Prettier)"
        spawned_for:
          - "review:quality"
          - "lint:backend"
          - "lint:frontend"
          - "format:check"
        context_focus: "Code standards, static analysis"
        timeout_minutes: 15

      - name: "TestCoverageAnalyzer"
        task: "Analisar coverage de testes (>80%)"
        spawned_for:
          - "review:coverage"
          - "analyze:tests"
          - "check:unit-tests"
          - "check:e2e-tests"
        context_focus: "Test patterns, coverage metrics, PHPUnit, Vitest"
        timeout_minutes: 20

    validation_criteria:
      - security_passed: true
      - coverage_min: 0.80
      - phpstan_passed: true
      - eslint_passed: true
      - no_critical_findings: true

    output_format: "structured_findings"

---
# AGENT 3: ANALYSIS AGENT
  - name: "AnalysisAgent"
    id: "analysis"
    role: "Planning & Requirements Analysis"
    model: "claude-sonnet"
    temperature: 0.3
    max_context_kb: 150
    timeout_minutes: 20

    description: |
      Responsável por análise de especificações, planejamento de sprints,
      estimativa de tarefas, identificação de dependências e blockers.
      Work com requirements, user stories e roadmaps.

    capabilities:
      - specification_analysis
      - sprint_planning
      - task_estimation
      - dependency_analysis
      - requirement_extraction

    context_files:
      - path: "agents/analysis/context-specs.md"
        size_kb: 25
        refresh_every_hours: 12
        description: "Especificações, user stories, critérios de aceitação"

      - path: "agents/analysis/context-architecture.md"
        size_kb: 22
        refresh_every_hours: 24
        description: "CLAUDE.md, constitution, arquitetura, database schema"

      - path: "agents/analysis/context-roadmap.md"
        size_kb: 18
        refresh_every_hours: 12
        description: "Timeline, phases, deliverables, blockers conhecidos"

      - path: "shared/glossary.md"
        size_kb: 10
        refresh_every_hours: 24
        description: "Termos e definições do projeto"

    subagents:
      - name: "SpecParser"
        task: "Extrair requirements de specs e user stories"
        spawned_for:
          - "analysis:spec"
          - "parse:requirements"
          - "extract:acceptance-criteria"
          - "read:userstory"
        context_focus: "Specification formats, requirements extraction"
        timeout_minutes: 15

      - name: "TaskPlanner"
        task: "Quebrar features em micro-tasks"
        spawned_for:
          - "analysis:plan"
          - "plan:sprint"
          - "plan:feature"
          - "break:tasks"
        context_focus: "Task decomposition, agile planning"
        timeout_minutes: 15

      - name: "Estimator"
        task: "Estimar tempo, complexidade, recursos"
        spawned_for:
          - "analysis:estimate"
          - "estimate:feature"
          - "estimate:task"
          - "estimate:sprint"
        context_focus: "Estimation techniques, complexity analysis"
        timeout_minutes: 12

      - name: "BlockerAnalyzer"
        task: "Identificar dependências, riscos e blockers"
        spawned_for:
          - "analysis:blockers"
          - "check:dependencies"
          - "identify:risks"
          - "validate:feasibility"
        context_focus: "Dependency analysis, risk management"
        timeout_minutes: 12

    output_format: "structured_plan"
    includes:
      - requirements_list
      - acceptance_criteria
      - task_breakdown
      - time_estimation
      - dependencies_map
      - risk_assessment

---
# WORKFLOWS
workflows:

  feature_implementation:
    name: "Feature Implementation Workflow"
    description: "Implementar nova feature completa (análise → código → review)"
    agents_sequence:
      - agent: "AnalysisAgent"
        task: "parse:requirements"
        output: "task_plan.md"
        duration_minutes: 15

      - agent: "CodingAgent"
        task: "feature:backend"
        depends_on: "task_plan.md"
        output: "backend_code.php"
        duration_minutes: 45

      - agent: "CodingAgent"
        task: "feature:frontend"
        parallel_with: "feature:backend"
        output: "frontend_code.vue"
        duration_minutes: 40

      - agent: "ReviewAgent"
        task: "review:security"
        depends_on: ["backend_code.php", "frontend_code.vue"]
        output: "security_findings.md"
        duration_minutes: 20

      - agent: "ReviewAgent"
        task: "review:quality"
        output: "quality_findings.md"
        duration_minutes: 15

      - agent: "ReviewAgent"
        task: "review:coverage"
        output: "coverage_report.md"
        duration_minutes: 10

      - agent: "CodingAgent"
        task: "git:commit"
        depends_on: ["security_findings.md", "quality_findings.md"]
        output: "pull_request.url"

    total_duration_minutes: "~120 (com paralelismo)"

  code_review_workflow:
    name: "Code Review Workflow"
    description: "Revisar PR completa (security → quality → approve)"
    agents_sequence:
      - agent: "ReviewAgent"
        task: "review:security"
        output: "security_audit.md"
        duration_minutes: 25

      - agent: "ReviewAgent"
        task: "review:performance"
        parallel_with: "review:security"
        output: "performance_audit.md"
        duration_minutes: 20

      - agent: "ReviewAgent"
        task: "review:quality"
        output: "quality_audit.md"
        duration_minutes: 15

      - agent: "ReviewAgent"
        task: "review:coverage"
        output: "coverage_check.md"
        duration_minutes: 12

      - agent: "CodingAgent"
        task: "fix:based-on-findings"
        depends_on: ["security_audit.md", "performance_audit.md", "quality_audit.md"]
        optional: true
        duration_minutes: 30

      - agent: "ReviewAgent"
        task: "re-review"
        depends_on: "pull_request.updated"
        optional: true
        duration_minutes: 15

    total_duration_minutes: "~60-90"

  sprint_planning_workflow:
    name: "Sprint Planning Workflow"
    description: "Planejar sprint inteira (análise → estimativa)"
    agents_sequence:
      - agent: "AnalysisAgent"
        task: "analysis:spec"
        output: "sprint_specs.md"
        duration_minutes: 20

      - agent: "AnalysisAgent"
        task: "plan:sprint"
        depends_on: "sprint_specs.md"
        output: "sprint_plan.md"
        duration_minutes: 20

      - agent: "AnalysisAgent"
        task: "analysis:estimate"
        depends_on: "sprint_plan.md"
        output: "sprint_estimates.md"
        duration_minutes: 15

      - agent: "ReviewAgent"
        task: "review:quality"
        depends_on: "sprint_estimates.md"
        output: "feasibility_check.md"
        duration_minutes: 10

    total_duration_minutes: "~65"

---
# AUTOMATION RULES
automation:
  github_pr_comments:
    - trigger: "@claude-code feature:"
      route_to: "CodingAgent"
      with_pre_analysis: true

    - trigger: "@claude-code review:"
      route_to: "ReviewAgent"

    - trigger: "@claude-code analysis:"
      route_to: "AnalysisAgent"

    - trigger: "@claude-code fix:"
      route_to: "CodingAgent"
      with_post_review: true

  auto_operations:
    - event: "push_to_develop"
      trigger: "ReviewAgent:review:quality"

    - event: "pr_created"
      trigger: "ReviewAgent:review:security"

    - event: "pr_ready_for_merge"
      trigger: "ReviewAgent:final_check"

---
# CONTEXT SHARING
context_sharing:
  shared_contexts:
    - "shared/conventions.md"
    - "shared/glossary.md"
    - "shared/definitions.md"

  agent_specific_contexts:
    coding:
      - "agents/coding/context-backend.md"
      - "agents/coding/context-frontend.md"
      - "agents/coding/context-project.md"

    review:
      - "agents/review/context-quality.md"
      - "agents/review/context-security.md"
      - "agents/review/context-performance.md"

    analysis:
      - "agents/analysis/context-specs.md"
      - "agents/analysis/context-architecture.md"
      - "agents/analysis/context-roadmap.md"

---
# MONITORING & LOGGING
monitoring:
  log_level: "info"
  track_metrics:
    - agent_execution_time
    - subagent_spawning
    - context_usage
    - output_quality

  alerts:
    - condition: "execution_time > timeout"
      action: "timeout_warning"

    - condition: "quality_score < 0.8"
      action: "quality_alert"
