; The php:*-cli base image ships no php.ini, so PHP falls back to
; upload_max_filesize=2M / post_max_size=8M and silently drops any larger
; upload before Laravel sees it. Keep these above the app's own limit
; (recipbot.pdf_import.max_file_kb, 20 MB by default).
upload_max_filesize = 25M
post_max_size = 30M
; Parsing a large PDF's text layer holds the whole document in memory.
memory_limit = 512M
