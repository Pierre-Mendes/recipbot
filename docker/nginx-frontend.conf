# nginx do frontend de produção: serve o SPA estático (build do Vue) com
# fallback de rota pro index.html (Vue Router client-side). NÃO faz proxy de
# /api — isso é papel do Ingress/reverse-proxy same-origin na frente.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets versionados (hash no nome) podem ter cache agressivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
